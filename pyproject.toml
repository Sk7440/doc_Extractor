[project]
name = "doc-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sk7440", email = "sultankhalid1007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.33.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
